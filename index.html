<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pendaftaran Lomba Experiment Antena 2M Band</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            /* 1. GAMBAR LATAR BELAKANG HALAMAN UTAMA */
            background-image: url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            /* 2. LAPISAN TRANSPARAN GELAP AGAR GAMBAR KOTAK TERLIHAT JELAS */
            background-image: linear-gradient(rgba(26, 32, 44, 0.65), rgba(26, 32, 44, 0.65)), url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            width: 100%;
            max-width: 500px;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            position: relative;
        }

        h2 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 25px;
            font-size: 1.4rem;
            line-height: 1.4;
            font-weight: 700;
            border-bottom: 3px solid #63b3ed;
            padding-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #edf2f7;
            margin-bottom: 4px;
            font-size: 0.95rem;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        .info-text {
            display: block;
            font-size: 0.8rem;
            color: #e2e8f0;
            margin-bottom: 8px;
            font-style: italic;
            line-height: 1.3;
            font-weight: 500;
        }

        input[type="text"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #4a5568;
            border-radius: 8px;
            font-size: 16px; 
            color: #ffffff;
            background-color: rgba(26, 32, 44, 0.85);
            outline: none;
            transition: border-color 0.2s, background-color 0.2s;
            -webkit-appearance: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #63b3ed;
            box-shadow: 0 0 0 3px rgba(99, 179, 237, 0.3);
            background-color: #1a202c;
        }

        ::placeholder {
            color: #718096;
            opacity: 1;
        }

        select {
            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%23a0aec0' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'%3E%3C/polyline%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 40px;
        }

        select option {
            background-color: #1a202c;
            color: #ffffff;
        }

        .animated-wrapper {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
        }

        .animated-wrapper.show {
            max-height: 120px;
            opacity: 1;
            margin-top: 15px;
        }

        .btn-submit {
            width: 100%;
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #2b6cb0;
        }

        .btn-submit:disabled {
            background-color: #4a5568;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* ===== STYLE POPUP MODAL MELAYANG ===== */
        .modal-overlay {
            display: flex;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            background-color: #1a202c;
            border: 2px solid #63b3ed;
            padding: 30px 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            width: 85%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            transform: scale(0.8);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 3.5rem;
            color: #48bb78;
            margin-bottom: 15px;
        }

        .modal-text {
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .btn-done {
            width: 100%;
            background-color: #48bb78;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(72, 187, 120, 0.3);
            transition: background-color 0.2s;
        }

        .btn-done:hover {
            background-color: #38a169;
        }

        .admin-section {
            margin-top: 30px;
            border-top: 1px dashed #4a5568;
            padding-top: 20px;
            text-align: center;
        }

        .admin-title {
            font-size: 0.85rem;
            color: #cbd5e0;
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-admin {
            flex: 1;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            background-color: #38a169;
            color: white;
            text-decoration: none;
            padding: 12px 8px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(56, 161, 105, 0.15);
            transition: background-color 0.2s;
        }

        .btn-admin:hover {
            background-color: #2f855a;
        }

        .copyright-text {
            display: block;
            font-size: 0.75rem;
            color: #a0aec0;
            text-align: center;
            margin-top: 15px;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px 10px;
            }
            .container {
                padding: 20px 15px;
            }
            .admin-buttons {
                flex-direction: column;
                gap: 8px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulir Pendaftaran Lomba Experiment Antena 2M Band</h2>
    
    <!-- HUBUNGKAN: Masukkan kembali URL Web App Google Sheets Anda pada action di bawah ini -->
    <form id="registrationForm" action="MASUKKAN_URL_WEB_APP_GOOGLE_SHEETS_DISINI" method="POST">
        
        <!-- Input Nama Asli -->
        <div class="form-group">
            <label for="nama_asli">Nama Asli :</label>
            <span class="info-text">(Nama Sesuai KTP)</span>
            <input type="text" id="nama_asli" name="nama_asli" required autocomplete="off">
        </div>

        <!-- Input Alamat -->
        <div class="form-group">
            <label for="alamat">Alamat (Nama Kota/Kabupaten):</label>
            <span class="info-text">(Contoh : Kendari, Konawe, Dll)</span>
            <input type="text" id="alamat" name="alamat" required autocomplete="off">
        </div>

        <!-- Input Jumlah Antena -->
        <div class="form-group">
            <label for="jumlah_antena">Jumlah Antena :</label>
            <span class="info-text">(Tiap Joki Maksimal 2 Antena / Jika Mendaftarkan 2 Antena, Wajib Menggunakan 2 Nama Lari)</span>
            <select id="jumlah_antena" name="jumlah_antena" onchange="handleAntennaChange()" required>
                <option value="1">1 Antena</option>
                <option value="2">2 Antena</option>
            </select>
        </div>

        <!-- Kolom Nama Lari 1 -->
        <div class="form-group" id="group_nama_lari_1">
            <label for="nama_lari_1">Nama Lari 1 :</label>
