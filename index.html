<!-- Input Jumlah Antena dengan Pilihan -->
<div class="form-group">
    <label for="jumlah_antena">Jumlah Antena :</label>
    <select id="jumlah_antena" name="jumlah_antena" onchange="toggleNamaLari()" required>
        <option value="1">1 Antena</option>
        <option value="2">2 Antena</option>
    </select>
    <small class="form-text">(Tiap Joki Maksimal 2 Antena / Jika Mendaftarkan 2 Antena, Wajib Menggunakan 2 Nama Lari)</small>
</div>

<!-- Kolom Dinamis Nama Lari -->
<div id="wrapper_nama_lari_1" class="form-group">
    <label for="nama_lari_1">Nama Lari 1 :</label>
    <input type="text" id="nama_lari_1" name="nama_lari_1" required>
</div>

<div id="wrapper_nama_lari_2" class="form-group" style="display: none;">
    <label for="nama_lari_2">Nama Lari 2 :</label>
    <input type="text" id="nama_lari_2" name="nama_lari_2">
</div>
