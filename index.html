<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pendaftaran</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .form-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333333;
            text-align: center;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666666;
            font-size: 14px;
            font-weight: 600;
        }
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            color: #333333;
            transition: border-color 0.3s ease;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #4ade80;
            outline: none;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #22c55e;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #16a34a;
        }
        .footer {
            text-align: center;
            margin-top: 15px;
            font-size: 12px;
            color: #999999;
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Formulir Pendaftaran</h2>
    <form action="#" method="POST" onsubmit="alert('Pendaftaran berhasil! (Ini adalah simulasi tampilan statis)'); return false;">
        <div class="form-group">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap Anda" required>
        </div>
        
        <div class="form-group">
            <label for="email">Alamat Email</label>
            <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
        </div>
        
        <div class="form-group">
            <label for="whatsapp">Nomor WhatsApp</label>
            <input type="tel" id="whatsapp" name="whatsapp" placeholder="08xxxxxxxxxx" required>
        </div>
        
        <div class="form-group">
            <label for="kategori">Kategori Pendaftaran</label>
            <select id="kategori" name="kategori" required>
                <option value="">-- Pilih Kategori --</option>
                <option value="umum">Umum</option>
                <option value="mahasiswa">Mahasiswa / Pelajar</option>
                <option value=" VIP">Jalur Khusus / VIP</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="catatan">Catatan Tambahan (Opsional)</label>
            <textarea id="catatan" name="catatan" placeholder="Tuliskan pesan atau catatan jika ada..."></textarea>
        </div>
        
        <button type="submit">Kirim Pendaftaran</button>
    </form>
    <div class="footer">
        Dibuat untuk GitHub Pages
    </div>
</div>

</body>
</html>
